# 평소 확인용 빌드. main에 push하거나 PR을 올리면 공통 빌드(_build.yml)를 돌린다.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 새로 push하면 이전 실행은 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_build.yml
