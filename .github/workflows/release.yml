# 릴리스: v로 시작하는 태그(예: v1.0.0)를 push하면 세 플랫폼을 빌드해서 GitHub Release를 만든다.
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# 태그는 pubspec.yaml의 version(+ 앞부분)과 같아야 한다. 하이픈이 들어간 태그(예: v1.1.0-beta.1)는
# 시험판(prerelease)으로 올린다.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  verify:
    name: Check tag matches pubspec version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare versions
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          tag="${GITHUB_REF_NAME#v}"
          echo "pubspec: $version, tag: $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::태그($GITHUB_REF_NAME)와 pubspec.yaml 버전($version)이 다릅니다. pubspec.yaml을 고친 뒤 다시 태그하세요."
            exit 1
          fi

  build:
    needs: verify
    uses: ./.github/workflows/_build.yml
    with:
      retention-days: 3

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 릴리스 노트에 이전 태그 이후 커밋을 넣으려면 전체 기록과 태그가 필요하다.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub 자동 노트는 병합된 PR만 모으는데, 이 저장소는 main에 바로 커밋하므로
          # 이전 태그 이후 커밋 제목으로 노트를 만든다.
          tool/release_notes.sh "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > notes.md
          flags=(--title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/*.zip "${flags[@]}"
